# ---------------------------------------------------------------------------
# nginx como reverse proxy do contêiner do Frontend (produção / build Vite).
#
# Reproduz as MESMAS regras de encaminhamento do proxy de desenvolvimento do
# Vite (ver frontend/vite.config.js). O navegador sempre chama caminhos
# relativos `/api/...`; o nginx:
#   1. serve os arquivos estáticos do build (SPA React), com fallback para
#      /index.html (roteamento client-side do react-router);
#   2. encaminha `/api/<servico>/...` ao backend correspondente, reescrevendo
#      o prefixo `/api/<servico>` para o prefixo real `/<servico>` exposto por
#      cada serviço na raiz.
#
# Mapeamento (equivalente ao rewrite do Vite ^/api/<servico> -> /<servico>):
#   /api/produtos            -> produtos:3001 /produtos
#   /api/produtos/:id/...    -> produtos:3001 /produtos/:id/...
#   /api/carrinho            -> carrinho:3002 /carrinho
#   /api/carrinho/:id/...    -> carrinho:3002 /carrinho/:id/...
#   /api/pedidos             -> pedidos:3003  /pedidos
#   /api/pedidos/:id/...     -> pedidos:3003  /pedidos/:id/...
#
# Os hostnames (produtos, carrinho, pedidos) são os NOMES DE SERVIÇO da rede
# do docker-compose, resolvidos via DNS interno do Docker. Mantê-los fixos
# aqui é intencional e simples (templating por env em nginx é mais complexo e
# desnecessário neste cenário). A rede e os nomes são definidos no compose
# (tarefa 11.2).
# ---------------------------------------------------------------------------

server {
    # Escuta na mesma porta do design/compose do Frontend (3000).
    listen 3000;
    server_name _;

    # Raiz dos arquivos estáticos gerados pelo `vite build`.
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Serviço_Produtos (3001)
    # Match exato para a chamada de listagem sem barra final (/api/produtos).
    location = /api/produtos {
        proxy_pass http://produtos:3001/produtos;
        include /etc/nginx/proxy_headers.conf;
    }
    # Demais chamadas com subcaminho (/api/produtos/:id, /estoque, etc.).
    location /api/produtos/ {
        proxy_pass http://produtos:3001/produtos/;
        include /etc/nginx/proxy_headers.conf;
    }

    # -----------------------------------------------------------------------
    # Serviço_Carrinho (3002)
    location = /api/carrinho {
        proxy_pass http://carrinho:3002/carrinho;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/carrinho/ {
        proxy_pass http://carrinho:3002/carrinho/;
        include /etc/nginx/proxy_headers.conf;
    }

    # -----------------------------------------------------------------------
    # Serviço_Pedidos (3003)
    location = /api/pedidos {
        proxy_pass http://pedidos:3003/pedidos;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/pedidos/ {
        proxy_pass http://pedidos:3003/pedidos/;
        include /etc/nginx/proxy_headers.conf;
    }

    # -----------------------------------------------------------------------
    # SPA React: qualquer outra rota serve o index.html (roteamento no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
